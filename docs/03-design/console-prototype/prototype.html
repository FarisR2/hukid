<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>HukID Consola</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sidebar fija por categorías + barra superior + vista única por sección; edición en panel lateral; sin sombras, solo bordes de 1px */
:root{
  --bg:#f4f7fa; --surface:#ffffff; --subtle:#f8fafb; --hover:#eef3f6;
  --fg:#142d3d; --muted:#4f6573; --faint:#7d919d;
  --border:#dde5eb; --border-strong:#c8d4dc;
  --primary:#075e67; --primary-hover:#034650; --on-primary:#ffffff; --badge:#e1f0ef;
  --focus:#1265b3; --danger:#a12435; --danger-bg:#fbebed; --on-danger:#ffffff;
  --warn:#8a5300; --warn-bg:#fdf3e1; --scrim:rgba(9,22,31,.42); --inverse:#142d3d; --on-inverse:#f4f7fa;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  --ctl:2.5rem; --r:8px; --sbw:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11212d; --surface:#182e3b; --subtle:#1b3341; --hover:#213b4a;
  --fg:#e6eff5; --muted:#a7bac6; --faint:#7f97a6; --border:#29424f; --border-strong:#36525f;
  --primary:#87d5d1; --primary-hover:#abe9e5; --on-primary:#0b2a2e; --badge:#25454a;
  --focus:#8bc1ff; --danger:#ffacb4; --danger-bg:#3b2229; --on-danger:#2a0d12;
  --warn:#f0c36b; --warn-bg:#3a3121; --scrim:rgba(0,0,0,.55); --inverse:#e6eff5; --on-inverse:#11212d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11212d; --surface:#182e3b; --subtle:#1b3341; --hover:#213b4a;
  --fg:#e6eff5; --muted:#a7bac6; --faint:#7f97a6; --border:#29424f; --border-strong:#36525f;
  --primary:#87d5d1; --primary-hover:#abe9e5; --on-primary:#0b2a2e; --badge:#25454a;
  --focus:#8bc1ff; --danger:#ffacb4; --danger-bg:#3b2229; --on-danger:#2a0d12;
  --warn:#f0c36b; --warn-bg:#3a3121; --scrim:rgba(0,0,0,.55); --inverse:#e6eff5; --on-inverse:#11212d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.opt-t .role{justify-self:start}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
#root{height:100%}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.tnum{font-variant-numeric:tabular-nums}

/* App shell */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;background:var(--bg);border-right:1px solid var(--border);padding:14px 10px 10px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--primary);display:grid;place-items:center}
.mark span{width:10px;height:10px;border:2px solid var(--on-primary);border-radius:3px;border-top-color:transparent}
.brand b{font-weight:600;letter-spacing:-.01em}
.brand small{color:var(--faint);font-size:12px;margin-left:auto}
.org{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:6px}
.org:hover{border-color:var(--border-strong)}
.org:has(select:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.org-av{width:28px;height:28px;border-radius:6px;background:var(--badge);color:var(--primary);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.org-txt{display:grid;min-width:0;line-height:1.25}
.org-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-ref{font-size:11px;color:var(--faint)}
.org svg{margin-left:auto;color:var(--faint)}
.org select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.nav-g{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r);color:var(--muted);text-decoration:none;font-weight:500;border:1px solid transparent}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav[aria-current="page"]{background:var(--surface);color:var(--fg);border-color:var(--border)}
.nav[aria-current="page"] svg{color:var(--primary)}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.nav .soon{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;line-height:17px}
.sb-foot{margin-top:auto;padding-top:10px;position:relative}
.user{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:var(--r);border:1px solid transparent;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.user:hover,.user[aria-expanded="true"]{background:var(--hover)}
.av{width:28px;height:28px;border-radius:50%;background:var(--inverse);color:var(--on-inverse);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.user-txt{display:grid;min-width:0;line-height:1.3}
.user-txt span:first-child{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-txt span:last-child{font-family:var(--mono);font-size:11px;color:var(--faint)}
.user svg{margin-left:auto;color:var(--faint)}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;z-index:20}
.menu-sec{padding:8px 8px 10px;display:grid;gap:6px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu-sec h4{margin:0;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;background:none;border-radius:6px;color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.menu-item:hover{background:var(--hover)}
.wrap{display:flex;flex-wrap:wrap;gap:4px}

.main{min-width:0;background:var(--surface);display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:56px;display:flex;align-items:center;gap:12px;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--faint);white-space:nowrap}
.crumbs .cur{color:var(--fg);font-weight:500}
.crumbs .org-c{overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.menu-btn{display:none}
.page{width:100%;max-width:1200px;margin:0 auto;padding-block:28px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.scrim{display:none}

/* Page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:clamp(1.375rem,1.1rem + .8vw,1.625rem);font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph p{margin-top:4px;color:var(--muted);max-width:62ch}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:grid;gap:12px;margin-top:28px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-h h2{font-size:15px;font-weight:600}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--ctl);padding:0 14px;border-radius:var(--r);border:1px solid transparent;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;background:none;color:var(--fg)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--surface);border-color:var(--border-strong)}
.btn-outline:hover,.btn-ghost:hover{background:var(--hover)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-danger:hover{filter:brightness(.92)}
.btn-danger-outline{border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);background:var(--surface)}
.btn-danger-outline:hover{background:var(--danger-bg)}
.btn-danger-ghost{color:var(--danger)}
.btn-danger-ghost:hover{background:var(--danger-bg)}
.btn-sm{height:32px;padding:0 10px;font-size:13px}
.btn-icon{width:var(--ctl);padding:0}
.btn-sm.btn-icon{width:32px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--primary);font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.link:hover{text-decoration:underline}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:500}
.help{font-size:12px;color:var(--faint)}
.err{font-size:12.5px;color:var(--danger);display:flex;align-items:center;gap:6px}
.input,.select{height:var(--ctl);width:100%;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);color:var(--fg);padding:0 12px;font:inherit}
.input::placeholder{color:var(--faint)}
.input:hover,.select:hover{border-color:var(--faint)}
[aria-invalid="true"]{border-color:var(--danger)!important}
.sel{position:relative}
.sel .select{appearance:none;padding-right:34px;cursor:pointer}
.sel svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--faint)}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search .input{padding-left:34px}
input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px;margin:2px 0 0;flex:none}
fieldset.fs{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
fieldset.fs legend{font-size:13px;font-weight:500;padding:0;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.opt{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;align-items:flex-start}
.opt:hover{border-color:var(--border-strong)}
.opt:has(input:checked){border-color:var(--primary);background:color-mix(in srgb,var(--badge) 55%,var(--surface))}
.opt-t{display:grid;gap:3px}
.opt-d{font-size:12.5px;color:var(--muted);line-height:1.4}

/* Chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip svg.i{width:12px;height:12px}
.chip-ok{color:var(--primary);background:var(--badge);border-color:transparent}
.chip-warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip-danger{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.role{display:inline-block;font-family:var(--mono);font-size:11.5px;line-height:18px;padding:0 6px;border-radius:5px;background:var(--subtle);border:1px solid var(--border);color:var(--fg)}
.cap{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* Banners */
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);border:1px solid;font-size:13.5px;margin-bottom:16px}
.banner>svg{margin-top:2px}
.banner-ok{background:var(--badge);border-color:color-mix(in srgb,var(--primary) 22%,transparent)}
.banner-ok>svg{color:var(--primary)}
.banner-err{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.banner-err>svg{color:var(--danger)}
.banner-info{background:var(--subtle);border-color:var(--border)}
.banner .b-body{display:grid;gap:8px;flex:1;min-width:0}
.banner .b-x{margin-left:auto;margin-top:-4px;margin-right:-4px}

/* Cards, metrics */
.card{border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.filters .field{flex:1 1 160px;max-width:220px}
.filters .grow{flex:2 1 240px;max-width:340px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metric{padding:16px;display:flex;flex-direction:column;gap:10px}
.metric-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.metric-k{font-size:13px;font-weight:500;color:var(--muted)}
.metric-v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.metric-v.none{color:var(--faint);font-weight:400}
.metric-f{margin-top:auto;display:grid;gap:2px;font-size:12px;color:var(--faint);padding-top:10px;border-top:1px solid var(--border)}
.metric-f .warn{color:var(--warn)}
.metric-f .danger{color:var(--danger)}

/* Tables */
.tcard{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--border);background:var(--subtle);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--subtle)}
.t-right{text-align:right}
.who{display:flex;align-items:center;gap:10px;min-width:220px}
.who .av{background:var(--badge);color:var(--primary)}
.who-t{display:grid;line-height:1.35}
.who-t span:last-child{font-size:12.5px;color:var(--faint)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.tfoot .btns{display:flex;gap:8px}
.empty{padding:48px 16px;text-align:center;display:grid;justify-items:center;gap:8px;color:var(--muted)}
.empty .e-ic{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);display:grid;place-items:center;color:var(--faint);margin-bottom:4px}
.empty h2,.empty h3{font-size:15px;font-weight:600;color:var(--fg)}
.empty p{max-width:46ch}

/* Explore pages */
.explore{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.explore .card{padding:18px;display:grid;gap:10px;align-content:start}
.explore h2{font-size:14px;font-weight:600}
.explore ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted)}
.skel{padding:16px;display:grid;gap:10px}
.skel div{height:12px;border-radius:4px;background:var(--hover)}

/* Dialogs */
dialog{color:var(--fg);background:var(--surface)}
dialog::backdrop{background:var(--scrim)}
dialog.modal{border:1px solid var(--border);border-radius:12px;padding:0;width:min(500px,calc(100vw - 32px))}
.m-b{padding:20px;display:grid;gap:16px}
.m-b h2{font-size:16px;font-weight:600}
.m-b .sub{color:var(--muted);margin-top:4px}
.m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--subtle);flex-wrap:wrap}
dialog.sheet{margin:0 0 0 auto;height:100%;max-height:100%;width:min(480px,100vw);max-width:100vw;border:0;border-left:1px solid var(--border);border-radius:0;padding:0}
dialog.sheet[open]{display:flex;flex-direction:column}
.s-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:1px solid var(--border)}
.s-h h2{font-size:16px;font-weight:600}
.s-b{flex:1;overflow-y:auto;padding:20px;display:grid;gap:20px;align-content:start}
.s-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.dz{border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);border-radius:var(--r);padding:14px;display:grid;gap:8px;justify-items:start}
.dz h3{font-size:14px;font-weight:600;color:var(--danger)}
.dz p{color:var(--muted);font-size:13px}
.diff{width:100%;border:1px solid var(--border);border-radius:var(--r);border-collapse:separate;border-spacing:0;overflow:hidden}
.diff th,.diff td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;text-align:left;vertical-align:top}
.diff tr:last-child th,.diff tr:last-child td{border-bottom:0}
.diff tbody th{color:var(--muted);font-weight:500;background:var(--subtle);width:84px}
.diff td.chg{background:color-mix(in srgb,var(--badge) 60%,var(--surface))}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r)}
.kv span{color:var(--muted)}

/* Session screens */
.center{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sess{width:min(420px,100%);display:grid;gap:20px}
.sess .brand{justify-content:center;padding:0}
.sess .card{padding:28px;display:grid;gap:14px}
.sess h1{font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sess .msg{color:var(--muted)}
.sess .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sess .foot{text-align:center;font-size:12px;color:var(--faint)}
.s-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--border);color:var(--muted)}
.s-ic.danger{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.s-ic.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Prototype controls */
.proto{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;justify-items:end;gap:8px}
.proto-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:var(--r);border:1px dashed var(--border-strong);background:var(--inverse);color:var(--on-inverse);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.proto-panel{width:min(290px,calc(100vw - 32px));background:var(--surface);border:1px dashed var(--border-strong);border-radius:10px;padding:14px;display:grid;gap:12px}
.proto-panel header{display:grid;gap:2px}
.proto-panel header span{font-size:12px;color:var(--faint)}
.proto-panel .select{height:34px;font-size:13px}
.chk{display:flex;gap:8px;font-size:13px;align-items:flex-start;cursor:pointer}

@media (max-width:1000px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);z-index:40;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px))}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:30}
  .menu-btn{display:inline-flex}
  .crumbs .org-c,.crumbs .sep1,.tb-session{display:none}
  .topbar{padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .explore{grid-template-columns:minmax(0,1fr)}
}

 return `<div class="center"><div class="sess">${brand}<main class="card" ${S.session==='denied'||SESS[S.session]&&SESS[S.session].k==='danger'?'role="alert"':''}>${body}</main><p class="foot">El inicio de sesión lo gestiona el proveedor de identidad de tu institución.</p></div></div>`;

function lastAdminLoss(rs,st){const m=MEMBERS.find(x=>x.id===ED.id);return m.status==='Activo'&&m.roles.includes('tenant_admin')&&(!rs.includes('tenant_admin')||st!=='Activo')&&activeAdmins().length===1}
function updateSheet(){
 ED.roles=[...sheet.querySelectorAll('input[name=ed-role]:checked')].map(i=>i.value);
 ED.status=$('#ed-status').value;ED.reason=$('#ed-reason').value;
 const la=lastAdminLoss(ED.roles,ED.status),box=$('#sh-alert');
 if(ED.alert)box.innerHTML=ED.alert;
 else box.innerHTML=la?banner('err','<strong>No puedes dejar la organización sin administradores.</strong><span>Asigna tenant_admin a otra persona activa antes de quitárselo a esta.</span>'):'';
 $('#ed-review').disabled=la||ED.alert&&ED.alert.includes('cambió mientras');
}
function review(){
 const m=MEMBERS.find(x=>x.id===ED.id);
 const same=ED.status===m.status&&ED.roles.slice().sort().join()===m.roles.slice().sort().join();
 if(same){ED.alert=banner('info','No hay cambios para revisar. Modifica los roles o el estado.');updateSheet();ED.alert=null;return}
 if(!ED.reason){field('ed-reason','Elige una razón para registrar el cambio.');$('#ed-reason').focus();return}
 field('ed-reason',null);
 const rc=ED.roles.slice().sort().join()!==m.roles.slice().sort().join(),sc=ED.status!==m.status;
 openModal(`<div class="m-b"><div><h2 id="m-title">Revisar cambio</h2><p class="sub">${esc(m.email)}</p></div>
 <table class="diff"><thead><tr><th></th><th>Antes</th><th>Después</th></tr></thead><tbody>
 <tr><th scope="row">Roles</th><td>${roles(m.roles)}</td><td class="${rc?'chg':''}">${roles(ED.roles)}</td></tr>
 <tr><th scope="row">Estado</th><td>${memberChip(m.status)}</td><td class="${sc?'chg':''}">${memberChip(ED.status)}</td></tr></tbody></table>
 <div class="kv"><span>Razón</span><strong>${reasonLabel(ED.reason)}</strong></div></div>
 <div class="m-f"><button class="btn btn-outline" data-act="close-modal">Cancelar</button><button class="btn btn-primary" data-act="confirm-change">Confirmar cambio</button></div>`);
}
function confirmChange(){
 closeModal();const m=MEMBERS.find(x=>x.id===ED.id);
 if(S.conflict&&!ED.conflictShown){
  ED.conflictShown=true;
  ED.alert=banner('err',`<strong>Este miembro cambió mientras lo editabas.</strong><span>No se guardó tu cambio. Carga la versión actual y revísalo de nuevo.</span><div><button class="btn btn-outline btn-sm" data-act="load-current">${ic('refresh')}Cargar versión actual</button></div>`);
  updateSheet();return;
 }
 m.roles=ED.roles.slice();m.status=ED.status;m.updated=now();m.version++;
 ACTIVITY.unshift({action:'Rol actualizado',actor:user().email,result:'Correcto',time:now(),ref:'ref·'+Math.random().toString(16).slice(2,8)});
 sheet.close();go('miembros',{kind:'ok',text:`Acceso de ${m.email} actualizado.`});
}
function loadCurrent(){
 const m=MEMBERS.find(x=>x.id===ED.id);m.version++;m.updated=now();
 const reason=ED.reason;ED={...ED,roles:[...m.roles],status:m.status,reason,alert:banner('info',`Cargaste la versión actual (v${m.version}). Vuelve a aplicar tu cambio y revísalo.`)};
 renderSheet();ED.alert=null;
}
function openRetire(){
 const m=MEMBERS.find(x=>x.id===ED.id),la=m.roles.includes('tenant_admin')&&m.status==='Activo'&&activeAdmins().length===1;
 openModal(`<div class="m-b"><div><h2 id="m-title">¿Retirar acceso definitivamente?</h2><p class="sub"><strong>${esc(m.email)}</strong> perderá el acceso a ${esc(org().name)}. Esta acción no se puede deshacer.</p></div>
 ${la?banner('err','<strong>No puedes dejar la organización sin administradores.</strong><span>Esta persona es la única con tenant_admin activo.</span>'):''}
 <div class="field"><label for="rt-reason">Razón</label>${sel('rt-reason',[['','Selecciona una razón'],...REASONS],ED.reason)}<p class="err" id="rt-reason-err" hidden></p></div></div>
 <div class="m-f"><button class="btn btn-outline" data-act="close-modal">Cancelar</button><button class="btn btn-danger" data-act="confirm-retire"${la?' disabled':''}>Retirar acceso definitivamente</button></div>`);
}
function confirmRetire(){
 if(!$('#rt-reason').value){field('rt-reason','Elige una razón para registrar la retirada.');return}
 const m=MEMBERS.find(x=>x.id===ED.id);m.status='Retirado';m.roles=[];m.updated=now();m.version++;
 ACTIVITY.unshift({action:'Acceso retirado',actor:user().email,result:'Correcto',time:now(),ref:'ref·'+Math.random().toString(16).slice(2,8)});
 closeModal();sheet.close();go('miembros',{kind:'ok',text:`Se retiró el acceso de ${m.email}.`});
}

/* ---------- Tema ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches}
function setTheme(v){if(v==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v;$('#p-theme').value=v;try{localStorage.setItem('hukid-theme',v)}catch(e){}if(S.session==='active')render()}
try{const t=localStorage.getItem('hukid-theme');if(t&&t!=='system'){document.documentElement.dataset.theme=t;$('#p-theme').value=t}}catch(e){}
mq.addEventListener&&mq.addEventListener('change',()=>{if(S.session==='active')render()});

/* ---------- Eventos ---------- */
const ACT={
 'nav-toggle':()=>{S.navOpen=!S.navOpen;render()},
 'close-nav':()=>{S.navOpen=false;render()},
 'user-menu':()=>{S.userMenu=!S.userMenu;render()},
 theme:()=>setTheme(isDark()?'light':'dark'),
 logout:()=>{closeModal();setSession('signedout')},
 sess:t=>setSession(t.dataset.to),
 'org-continue':()=>{S.org=$('#os-org').value;if(S.org==='crn'){setSession('orgunavailable');return}S.session='active';go('resumen');render()},
 invite:openInvite, accept:openAccept,
 edit:t=>openEdit(t.dataset.id), revoke:t=>openRevoke(t.dataset.id),
 'confirm-revoke':t=>{const i=INVITES.find(x=>x.id===t.dataset.id);i.delivery='Revocada';i.expires=null;closeModal();go('invitaciones',{kind:'ok',text:`Invitación a ${i.email} revocada.`})},
 'close-modal':closeModal, 'close-sheet':()=>sheet.close(),
 review, 'confirm-change':confirmChange, 'load-current':loadCurrent, retire:openRetire, 'confirm-retire':confirmRetire,
 'm-next':()=>{S.mPage++;$('#m-table').innerHTML=membersTable()},
 'm-reset':()=>{S.mPage=0;$('#m-table').innerHTML=membersTable()},
 'm-clear':()=>{S.mf={q:'',estado:'',rol:''};S.mPage=0;render()},
 'a-next':()=>{S.aPage++;$('#a-table').innerHTML=activityTable()},
 'a-reset':()=>{S.aPage=0;$('#a-table').innerHTML=activityTable()},
 'flash-x':()=>{S.flash=null;render()},
 proto:t=>{const p=$('#proto-panel');p.hidden=!p.hidden;t.setAttribute('aria-expanded',String(!p.hidden))}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');
 if(S.userMenu&&!e.target.closest('.sb-foot')){S.userMenu=false;render();if(!t)return}
 if(t&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t,e)}
 if(e.target===sheet)sheet.close();
});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='m-q'){S.mf.q=e.target.value;S.mPage=0;$('#m-table').innerHTML=membersTable()}
});
document.addEventListener('change',e=>{
 const id=e.target.id,v=e.target.value;
 if(id==='m-estado'||id==='m-rol'){S.mf[id.slice(2)]=v;S.mPage=0;$('#m-table').innerHTML=membersTable()}
 else if(id==='a-res'||id==='a-acc'){S.af[id.slice(2)]=v;S.aPage=0;$('#a-table').innerHTML=activityTable()}
 else if(id==='i-f'){S.inf=v;$('#i-table').innerHTML=invTable()}
 else if(id==='org-switch'){if(v==='crn'){S.org=v;setSession('orgunavailable');return}S.org=v;S.mf={q:'',estado:'',rol:''};go('resumen',{kind:'ok',text:`Ahora trabajas en ${org().name}.`})}
 else if(sheet.contains(e.target))updateSheet();
 else if(id==='p-role'){S.role=v;S.flash=null;S.userMenu=false;render()}
 else if(id==='p-session'){setSession(v)}
 else if(id==='p-conflict'){S.conflict=e.target.checked}
 else if(id==='p-theme'){setTheme(v)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const id=e.target.id;
 if(id==='invite-form')submitInvite();
 else if(id==='accept-form')submitAccept();
 else if(id==='period'){
  const f=$('#p-from').value,t=$('#p-to').value,iss=$('#p-issuer');
  const days=(new Date(t)-new Date(f))/864e5;
  const err=!f||!t?'Indica las dos fechas del periodo.':days<0?'La fecha «Desde» debe ser anterior a «Hasta».':days>31?'El periodo puede abarcar como máximo 31 días. Acorta el rango.':null;
  field('p-to',err);const pe=$('#p-err');pe.hidden=!err;pe.innerHTML=err?ic('alert')+esc(err):'';
  if(err)return;
  S.period={from:f,to:t,issuer:iss.value};S.periodMsg=`Periodo aplicado: ${f} a ${t} · ${iss.options[iss.selectedIndex].text}.`;render();
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.navOpen){S.navOpen=false;render()}});
window.addEventListener('hashchange',()=>{if(S.flash&&S.flash.route!==route())S.flash=null;S.periodMsg=null;S.navOpen=false;S.userMenu=false;render();window.scrollTo(0,0)});

render();
})();
</script>
</body></html>
